name: Release binary

# Build a linux-amd64 binary and attach it to a git tag release so harness CI
# can download it instead of cargo-building on every PR.
on:
  push:
    tags:
      - "v*"
      - "bot-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag naming the checked-out commit, bot-<7-char-sha> (e.g. bot-1bd5636)
        required: true

permissions:
  contents: write

jobs:
  release-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.8.2

      - name: Build release binary
        run: |
          set -euo pipefail
          export IBEX_BENCHMARK_BOT_BUILD_SHA="$(git rev-parse HEAD)"
          echo "Building ibex-benchmark-bot for ${IBEX_BENCHMARK_BOT_BUILD_SHA}"
          cargo build --release

      - name: Stage asset
        run: |
          set -euo pipefail
          cp target/release/ibex-benchmark-bot ibex-benchmark-bot-linux-amd64
          chmod +x ibex-benchmark-bot-linux-amd64

      - name: Verify build provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short="${sha:0:7}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          # The harness pins BENCHMARK_BOT_RELEASE_TAG=bot-<7-char-sha> and silently
          # ignores a tag that does not match the pin's short SHA, so a release under
          # any other tag can never be picked up.
          if [ "$tag" != "bot-${short}" ] && [ "$tag" != "v${short}" ]; then
            echo "::error::Release tag ${tag} does not name commit ${sha} (expected bot-${short}); the harness would ignore it."
            exit 1
          fi
          info="$(./ibex-benchmark-bot-linux-amd64 build-info)"
          printf '%s\n' "$info"
          reported="$(printf '%s\n' "$info" | sed -n 's/^build_sha=//p')"
          if [ "$reported" != "$sha" ]; then
            echo "::error::build-info reports build_sha=${reported}, expected ${sha}; refusing to publish an unverifiable asset."
            exit 1
          fi
          echo "Verified build_sha=${sha} for tag ${tag}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "ibex-benchmark-bot $TAG" \
              --notes "Pinned bot binary for harness BENCHMARK_BOT_SHA=${sha}." \
              --target "$sha"
          fi
          sha256sum ibex-benchmark-bot-linux-amd64 > ibex-benchmark-bot-linux-amd64.sha256
          gh release upload "$TAG" ibex-benchmark-bot-linux-amd64 ibex-benchmark-bot-linux-amd64.sha256 --clobber
